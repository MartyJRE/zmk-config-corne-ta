# keymap-drawer settings: https://github.com/caksoylar/keymap-drawer/blob/main/CONFIGURATION.md
parse_config:
  # readable labels for custom behaviours and raw chords in the keymap
  raw_binding_map:
    "&bt_clr_hold 0 0": {t: "BT clear", h: "hold 1s"}
    "&meh_seq R R": "Rename"
    "&meh_seq R P": "Param"
    "&meh_seq R F": "Field"
    "&meh_seq R C": "Const"
    "&meh_seq R M": "Method"
    "&meh_seq C S": "Signature"
    "&kp LG(LA(N))": "Inline"
    "&kp LC(LA(LS(UP)))": "Clone ↑"
    "&kp LC(LA(LS(DOWN)))": "Clone ↓"
    "&kp LC(LA(LS(LEFT)))": "Clone ←"
    "&kp LC(LA(LS(RIGHT)))": "Clone →"
    "&kp LA(LG(LEFT))": "Back"
    "&kp LA(LG(RIGHT))": "Forward"
    "&kp LA(ENTER)": "Action"
    "&kp LA(LS(ENTER))": "Import"
    "&kp LA(LG(B))": "Impl"
    "&caps_word": "Caps Word"
draw_config:
  append_colon_to_layer_header: false
  draw_key_sides: true
  # Styled after the physical board: navy case, slate-blue caps with light legends,
  # lighter accent caps on the outer columns and the thumb clusters.
  svg_extra_style: |
    svg.keymap { background: #1b2238; font-family: Inter, -apple-system, Helvetica, sans-serif; }
    text.label { fill: #dfe6f5; font-weight: 600; stroke: none; }
    rect.key { fill: #5a6a9e; stroke: none; }
    rect.key.side { fill: #2f3b66; stroke: #151b30; stroke-width: 1; }
    text.key { fill: #bcd4f3; }
    text.key.hold { fill: #8ea6d3; }
    g.key.trans rect.key { fill: #4a5885; }
    g.key.trans rect.key.side { fill: #2a3459; }
    g.key.trans text.key { fill: #7688b5; }
    g.key.held rect.key { fill: #b7d1f1; }
    g.key.held text.key { fill: #1b2238; }
    g.keypos-0 rect.key, g.keypos-11 rect.key, g.keypos-12 rect.key, g.keypos-23 rect.key,
    g.keypos-24 rect.key, g.keypos-35 rect.key, g.keypos-36 rect.key, g.keypos-37 rect.key,
    g.keypos-38 rect.key, g.keypos-39 rect.key, g.keypos-40 rect.key, g.keypos-41 rect.key { fill: #8db3e2; }
    g.keypos-0 rect.key.side, g.keypos-11 rect.key.side, g.keypos-12 rect.key.side, g.keypos-23 rect.key.side,
    g.keypos-24 rect.key.side, g.keypos-35 rect.key.side, g.keypos-36 rect.key.side, g.keypos-37 rect.key.side,
    g.keypos-38 rect.key.side, g.keypos-39 rect.key.side, g.keypos-40 rect.key.side, g.keypos-41 rect.key.side { fill: #5b83b7; }
    g.keypos-0 text.key, g.keypos-11 text.key, g.keypos-12 text.key, g.keypos-23 text.key,
    g.keypos-24 text.key, g.keypos-35 text.key, g.keypos-36 text.key, g.keypos-37 text.key,
    g.keypos-38 text.key, g.keypos-39 text.key, g.keypos-40 text.key, g.keypos-41 text.key { fill: #16203a; }
    g.keypos-0.trans rect.key, g.keypos-11.trans rect.key, g.keypos-12.trans rect.key, g.keypos-23.trans rect.key,
    g.keypos-24.trans rect.key, g.keypos-35.trans rect.key, g.keypos-36.trans rect.key, g.keypos-37.trans rect.key,
    g.keypos-38.trans rect.key, g.keypos-39.trans rect.key, g.keypos-40.trans rect.key, g.keypos-41.trans rect.key { fill: #6d93c4; }
    rect.combo { fill: #dfe6f5; stroke: #8db3e2; }
    text.combo { fill: #16203a; }
    path.combo { stroke: #8db3e2; }
